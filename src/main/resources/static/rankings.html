<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 排行榜</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link" href="./matches.html">比赛管理</a>
      <a class="nav-link" href="./teams.html">球队管理</a>
      <a class="nav-link" href="./players.html">球员管理</a>
      <a class="nav-link" href="./rankings.html">排行榜</a>
      <a class="nav-link" href="./reports.html">报告中心</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1>球员排行榜</h1>
      <p>得分榜、助攻榜、篮板榜、全局排行榜</p>
    </section>

    <section class="card">
      <div class="filter-bar">
        <select id="rankMode">
          <option value="overall">全局排行榜</option>
          <option value="match">单场排行榜</option>
        </select>
        <select id="rankMatchId" style="display:none">
          <option value="">请选择比赛</option>
        </select>
        <select id="rankStatKey">
          <option value="SCORE">得分</option>
          <option value="ASSIST">助攻</option>
          <option value="REBOUND">篮板</option>
          <option value="FOUL">犯规</option>
          <option value="STEAL">抢断</option>
          <option value="TURNOVER">失误</option>
        </select>
        <button class="btn btn-sm" onclick="RankingsPage.load()">查询</button>
      </div>
    </section>

    <section class="card">
      <h2 id="rankTitle">排行榜</h2>
      <div id="rankList"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/pages/rankings.js"></script>
</body>
</html>
