<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 报告中心</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link" href="./matches.html">比赛管理</a>
      <a class="nav-link" href="./teams.html">球队管理</a>
      <a class="nav-link" href="./players.html">球员管理</a>
      <a class="nav-link" href="./rankings.html">排行榜</a>
      <a class="nav-link" href="./reports.html">报告中心</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1>报告中心</h1>
      <p>查看历史报告、生成报告、Markdown 预览</p>
    </section>

    <section class="card">
      <h2>选择比赛与生成报告</h2>
      <div class="filter-bar">
        <select id="reportMatchId">
          <option value="">请选择比赛</option>
        </select>
        <button class="btn btn-orange btn-sm" onclick="ReportsPage.generateReport('SITUATION')">生成态势报告</button>
        <button class="btn btn-red btn-sm" onclick="ReportsPage.generateReport('REVIEW')">生成复盘报告</button>
        <button class="btn btn-sm" onclick="ReportsPage.loadReports()">查询报告</button>
      </div>
    </section>

    <!-- 流式生成预览区域 -->
    <section class="card" id="streamSection" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 id="streamTitle">正在生成报告...</h2>
        <span class="streaming-badge" id="streamBadge">● 生成中</span>
      </div>
      <div class="stream-preview" id="streamPreview"></div>
    </section>

    <section>
      <div id="reportList"></div>
    </section>
  </main>

  <!-- 报告详情弹窗 -->
  <div class="modal-overlay" id="reportDetailModal">
    <div class="modal" style="max-width:800px">
      <h2 id="reportDetailTitle">报告详情</h2>
      <div class="modal-body" id="reportDetailContent"></div>
      <div class="btn-group">
        <button class="btn btn-sm" onclick="Common.closeModal('reportDetailModal')">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/pages/reports.js"></script>
</body>
</html>
