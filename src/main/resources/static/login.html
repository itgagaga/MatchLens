<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 登录</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      width: 100%;
      max-width: 420px;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-brand h1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 6px;
    }
    .auth-brand p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }
    .auth-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: #f1f5f9;
      border-radius: 14px;
      padding: 4px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 14px;
      margin-top: 8px;
    }
    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .auth-error.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>🏆 MatchLens</h1>
        <p>体育赛事智能分析系统</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">登录</div>
        <div class="auth-tab" onclick="switchTab('register')">注册</div>
      </div>

      <div id="authError" class="auth-error"></div>

      <!-- 登录表单 -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名" required />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required />
        </div>
        <button type="submit" class="btn auth-submit">登 录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名（用于登录）" required />
        </div>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="regNickname" placeholder="请输入显示昵称（选填）" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6" />
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regConfirmPassword" placeholder="请再次输入密码" required />
        </div>
        <button type="submit" class="btn auth-submit">注 册</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/pages/auth.js"></script>
</body>
</html>
