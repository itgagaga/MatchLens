<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 个人中心</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./client-index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link" href="./client-index.html">赛事中心</a>
      <a class="nav-link" href="./client-teams.html">球队阵容</a>
      <a class="nav-link" href="./client-rankings.html">排行榜</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1>个人中心</h1>
      <p>管理您的账号信息</p>
    </section>

    <div class="grid grid-2">
      <!-- 基本信息卡片 -->
      <section class="card">
        <h2>👤 基本信息</h2>
        <div style="margin-top: 16px;">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="usernameDisplay" disabled style="background: #f1f5f9; color: #64748b;" />
          </div>
          <div class="form-group">
            <label>角色</label>
            <input type="text" id="roleDisplay" disabled style="background: #f1f5f9; color: #64748b;" />
          </div>
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="nicknameInput" placeholder="请输入新昵称" />
          </div>
          <button class="btn" onclick="ClientProfilePage.saveNickname()">保存昵称</button>
        </div>
      </section>

      <!-- 修改密码卡片 -->
      <section class="card">
        <h2>🔒 修改密码</h2>
        <div style="margin-top: 16px;">
          <div class="form-group">
            <label>当前密码</label>
            <input type="password" id="oldPassword" placeholder="请输入当前密码" />
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）" minlength="6" />
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="请再次输入新密码" />
          </div>
          <button class="btn btn-orange" onclick="ClientProfilePage.changePassword()">修改密码</button>
        </div>
      </section>
    </div>

    <!-- 危险操作 -->
    <section class="card" style="border-color: rgba(239, 68, 68, 0.3);">
      <h2 style="color: var(--danger);">⚠️ 其他操作</h2>
      <p style="color: var(--text-muted); margin: 12px 0;">退出当前账号，返回登录页面。</p>
      <button class="btn btn-red" onclick="Common.logout()">退出登录</button>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/pages/client-profile.js"></script>
</body>
</html>
