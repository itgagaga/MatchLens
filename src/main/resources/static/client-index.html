<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 赛事中心</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./client-index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link active" href="./client-index.html">赛事中心</a>
    </nav>
    <div class="nav" style="margin-left: auto;">
      <span id="userGreeting" style="color: #cbd5e1; font-size: 14px; padding: 8px 12px;"></span>
      <a class="nav-link" href="#" onclick="ClientPage.logout()" style="color: #f87171;">退出</a>
    </div>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1 id="welcomeTitle">欢迎来到 MatchLens 赛事中心</h1>
      <p>实时赛事数据、智能推荐，尽在掌握</p>
    </section>

    <!-- AI 智能推荐 -->
    <section class="card">
      <h2>🤖 AI 智能推荐</h2>
      <p style="color: var(--text-muted); margin-bottom: 14px; font-size: 14px;">
        描述你想看的比赛，AI 将为你智能推荐最匹配的赛事
      </p>
      <div style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
        <div class="form-group" style="flex: 1; min-width: 240px; margin-bottom: 0;">
          <input type="text" id="aiPreference" placeholder="例如：想看篮球且比赛较为焦灼的" />
        </div>
        <button class="btn btn-green" id="btnAiRecommend" onclick="ClientPage.recommendMatches()">
          ✨ 智能推荐
        </button>
      </div>
      <div id="aiRecommendResult" style="margin-top: 16px; display: none;"></div>
    </section>

    <!-- 条件筛选 -->
    <section class="card">
      <h2>🔍 条件查询</h2>
      <div class="filter-bar">
        <select id="filterSportType">
          <option value="">全部赛事类型</option>
          <option value="BASKETBALL">🏀 篮球</option>
          <option value="FOOTBALL">⚽ 足球</option>
          <option value="VOLLEYBALL">🏐 排球</option>
          <option value="GENERAL">🏅 通用</option>
        </select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="NOT_STARTED">未开始</option>
          <option value="RUNNING">进行中</option>
          <option value="PAUSED">已暂停</option>
          <option value="FINISHED">已结束</option>
        </select>
        <input type="text" id="filterKeyword" placeholder="搜索比赛/队伍名称" style="width: auto; min-width: 180px;" />
        <button class="btn btn-sm" onclick="ClientPage.loadMatches()">筛选</button>
      </div>
    </section>

    <!-- 比赛列表 -->
    <section>
      <div class="grid grid-3" id="matchList"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/pages/client-matches.js"></script>
</body>
</html>
