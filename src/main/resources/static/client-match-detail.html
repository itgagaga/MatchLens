<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 比赛详情</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./client-index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link" href="./client-index.html">赛事大厅</a>
      <a class="nav-link" href="./client-teams.html">球队阵容</a>
      <a class="nav-link" href="./client-rankings.html">排行榜</a>
    </nav>
  </header>

  <main class="page">
    <div style="margin-bottom:16px">
      <a class="btn btn-sm" href="./client-index.html">← 返回赛事大厅</a>
    </div>

    <div class="detail-layout">
      <!-- 左栏：原有内容 -->
      <div class="detail-main">
        <div id="scoreBoard"></div>

        <section class="card">
          <h2>比赛信息</h2>
          <div id="matchInfo" class="match-info-grid" style="margin-top:12px"></div>
          <div style="margin-top:14px">
            <a id="rosterLink" class="roster-link-btn" href="#">👥 查看球队阵容</a>
          </div>
        </section>

        <section class="grid grid-2">
          <section class="card">
            <h2>事件时间线</h2>
            <div id="eventTimeline" class="scroll-panel"></div>
          </section>
          <section class="card">
            <h2>实时统计</h2>
            <div id="statisticsPanel" class="scroll-panel"></div>
          </section>
        </section>

        <section class="grid grid-2">
          <section class="card">
            <h2>📊 最新态势分析</h2>
            <div id="latestAnalysis" class="ai-result"></div>
          </section>
          <section class="card">
            <h2>📋 最新复盘报告</h2>
            <div id="latestReview" class="ai-result"></div>
          </section>
        </section>
      </div>

      <!-- 右栏：AI 问答助手 -->
      <aside class="detail-sidebar">
        <section class="card qa-sidebar-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
            <h2 style="margin:0">🤖 AI 赛事问答</h2>
            <button class="btn btn-sm btn-red" onclick="ClientMatchDetailPage.clearQaHistory()" style="padding:4px 10px;font-size:11px">清空记录</button>
          </div>
          <p class="qa-subtitle">基于实时数据为您解答</p>
          <div id="qaChatArea" class="qa-chat-area">
            <div id="qaMessages" class="qa-messages">
              <div class="qa-welcome">
                <div class="qa-welcome-icon">🤖</div>
                <div class="qa-welcome-text">您好！我是智能赛事助手</div>
                <div class="qa-welcome-hint">您可以问我关于这场比赛的任何问题</div>
                <div class="qa-quick-questions">
                  <button class="qa-quick-btn" onclick="ClientMatchDetailPage.askQuickQuestion('这场比赛目前比分是多少？')">目前比分</button>
                  <button class="qa-quick-btn" onclick="ClientMatchDetailPage.askQuickQuestion('哪位球员表现最出色？')">最佳球员</button>
                  <button class="qa-quick-btn" onclick="ClientMatchDetailPage.askQuickQuestion('比赛中有哪些关键时刻？')">关键时刻</button>
                  <button class="qa-quick-btn" onclick="ClientMatchDetailPage.askQuickQuestion('双方的优势和劣势分别是什么？')">优劣势分析</button>
                </div>
              </div>
            </div>
            <div class="qa-input-row">
              <input id="qaInput" type="text" class="qa-input" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')ClientMatchDetailPage.askQuestion()" />
              <button id="qaSendBtn" class="btn btn-primary qa-send-btn" onclick="ClientMatchDetailPage.askQuestion()">发送</button>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/pages/client-match-detail.js"></script>
</body>
</html>
