<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchLens - 个人中心</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">🏆 MatchLens</a>
    <nav class="nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link" href="./matches.html">比赛管理</a>
      <a class="nav-link" href="./teams.html">球队管理</a>
      <a class="nav-link" href="./players.html">球员管理</a>
      <a class="nav-link" href="./rankings.html">排行榜</a>
      <a class="nav-link" href="./reports.html">报告中心</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <h1>个人中心</h1>
      <p>管理您的账号信息</p>
    </section>

    <div class="grid grid-2">
      <!-- 基本信息卡片 -->
      <section class="card">
        <h2>👤 基本信息</h2>
        <div style="margin-top: 16px;">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="usernameDisplay" disabled style="background: #f1f5f9; color: #64748b;" />
          </div>
          <div class="form-group">
            <label>角色</label>
            <input type="text" id="roleDisplay" disabled style="background: #f1f5f9; color: #64748b;" />
          </div>
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="nicknameInput" placeholder="请输入新昵称" />
          </div>
          <button class="btn" onclick="saveNickname()">保存昵称</button>
        </div>
      </section>

      <!-- 修改密码卡片 -->
      <section class="card">
        <h2>🔒 修改密码</h2>
        <div style="margin-top: 16px;">
          <div class="form-group">
            <label>当前密码</label>
            <input type="password" id="oldPassword" placeholder="请输入当前密码" />
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）" minlength="6" />
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="请再次输入新密码" />
          </div>
          <button class="btn btn-orange" onclick="changePassword()">修改密码</button>
        </div>
      </section>
    </div>

    <!-- 危险操作 -->
    <section class="card" style="border-color: rgba(239, 68, 68, 0.3);">
      <h2 style="color: var(--danger);">⚠️ 其他操作</h2>
      <p style="color: var(--text-muted); margin: 12px 0;">退出当前账号，返回登录页面。</p>
      <button class="btn btn-red" onclick="Common.logout()">退出登录</button>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/constants.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/common.js"></script>
  <script>
    // 初始化页面信息
    (function initProfile() {
      document.getElementById('usernameDisplay').value = localStorage.getItem('username') || '';
      document.getElementById('roleDisplay').value = localStorage.getItem('role') === 'ADMIN' ? '管理员' : '普通用户';
      document.getElementById('nicknameInput').value = localStorage.getItem('nickname') || '';
    })();

    async function saveNickname() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) {
        Common.toast('昵称不能为空');
        return;
      }
      try {
        await API.updateNickname(nickname);
        localStorage.setItem('nickname', nickname);
        Common.toast('昵称修改成功！');
        // 更新 topbar 显示
        const nameEl = document.querySelector('.user-name');
        if (nameEl) nameEl.textContent = nickname;
      } catch (e) {
        Common.toast(e.message || '修改失败');
      }
    }

    async function changePassword() {
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!oldPassword) { Common.toast('请输入当前密码'); return; }
      if (!newPassword || newPassword.length < 6) { Common.toast('新密码长度不能少于6位'); return; }
      if (newPassword !== confirmPassword) { Common.toast('两次输入的新密码不一致'); return; }

      try {
        await API.updatePassword(oldPassword, newPassword);
        Common.toast('密码修改成功，请重新登录！');
        // 清空表单
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        // 1.5秒后退出登录
        setTimeout(() => Common.logout(), 1500);
      } catch (e) {
        Common.toast(e.message || '修改失败');
      }
    }
  </script>
</body>
</html>
